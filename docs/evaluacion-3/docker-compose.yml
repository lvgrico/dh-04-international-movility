# Only the database is containerised; the API runs with `npm start`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: imams
      POSTGRES_DB: imams
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
